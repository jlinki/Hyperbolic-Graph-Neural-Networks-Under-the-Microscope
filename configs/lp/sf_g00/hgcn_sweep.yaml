project: Hyperbolic GNNs  # W&B project name
method: random
name: scale_free_g0.0 LP HGCN Sweep

parameters:
  dataset.name:
    value: sf_g0
  dataset.task:
    value: lp
  dataset.split:
    value: geom-gcn
  dataset.num_val:
    value: 0.05
  dataset.num_test:
    value: 0.1
  dataset.normalize_feats:
    value: False
  dataset.normalize_adj:
    value: True
  dataset.add_self_loops:
    value: True

  training.lr:
    values: [0.001, 0.01, 0.02, 0.05, 0.1]
  training.weight_decay:
    values: [0.0, 0.0001, 0.001, 0.01]
  training.epochs:
    value: 5000
  training.patience:
    value: 100
  training.min_epochs:
    value: 100
  training.seeds:
    value: [42, 123] # Can be expanded for multiple seeds
  training.optimizer:
    value: adam
  training.momentum:
    value: 0.999
  training.scheduler:
    value: StepLR
  training.scheduler_gamma:
    value: 0.5
  training.lr_reduce_freq:
    value: None
  training.grad_clip:
    values: [None, 1.0]
  training.save_embeddings:
    value: False
  training.margin:
    values: [2.0, 6.0, 8.0, 10.0, 20.0]

  model.name:
    value: HGCN
  model.hidden_dim:
    values: [16, 32, 64, 128]
  model.dropout:
    values: [0.0, 0.1, 0.2, 0.4, 0.6, 0.8]
  model.manifold:
    value: PoincareBall
  model.c:
    value: 1.0
  model.r:
    value: None
  model.t:
    value: None
  model.pretrained_embeddings:
    value: null
  model.pos_weight:
    value: false
  model.num_layers:
    values: [1, 2, 3, 4, 6, 8]
  model.bias:
    value: true
  model.act:
    values: [None, relu, leaky_relu, tanh]
  model.n_heads:
    value: [1]
  model.use_att:
    values: [True, False]
  model.double_precision:
    value: false
  model.local_agg: 
    value: [True]
