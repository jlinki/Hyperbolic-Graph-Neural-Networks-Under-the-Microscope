project: Hyperbolic GNNs  # W&B project name
method: grid
name: tree1111_g00_lp LP HyboNet Lorentz Sweep dim3

parameters:
  dataset.name:
    value: tree1111_g00_lp
  dataset.task:
    value: lp
  dataset.split:
    value: geom-gcn
  dataset.num_val:
    value: 0.05
  dataset.num_test:
    value: 0.1
  dataset.normalize_feats:
    value: False
  dataset.normalize_adj:
    value: True
  dataset.add_self_loops:
    value: True

  training.lr:
    values: [0.001, 0.005, 0.01, 0.02, 0.05]
  training.weight_decay:
    values: [0.0, 0.001, 0.01]
  training.epochs:
    value: 5000
  training.patience:
    value: 100
  training.min_epochs:
    value: 100
  training.seeds:
    value: [42, 123]  # Can be expanded for multiple seeds
  training.optimizer:
    value: radam
  training.momentum:
    value: 0.999
  training.scheduler:
    value: StepLR
  training.scheduler_gamma:
    value: 0.5
  training.lr_reduce_freq:
    value: None
  training.grad_clip:
    values: [None, 1.0]
  training.save_embeddings:
    value: False

  model.name:
    value: HyboNet
  model.hidden_dim:
    values: [3]
  model.dropout:
    values: [0.0, 0.1, 0.2, 0.4, 0.6]
  model.manifold:
    value: Lorentz
  model.c:
    value: 1.0
  model.r:
    value: None
  model.t:
    value: None
  model.pretrained_embeddings:
    value: null
  model.pos_weight:
    value: false
  model.num_layers:
    values: [1, 2, 4, 6, 10]
  model.bias:
    value: true
  model.act:
    values: [None, relu]
  model.n_heads:
    value: [1]
  model.use_att:
    values: [False]
  model.double_precision:
    value: false
