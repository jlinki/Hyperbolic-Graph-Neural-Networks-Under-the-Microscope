project: Hyperbolic GNNs

parameters:
  dataset.name: tree1111_g00_lp      # Name of the dataset (e.g., 'cora', 'citeseer', 'pubmed')
  dataset.task: lp                   # Task type: 'nc' for node classification, 'lp' for link prediction, etc.
  dataset.split: geom-gcn            # Split strategy (e.g., 'geom-gcn', 'random', 'fixed')
  dataset.num_val: 0.05              # Ratio of the validation data if there are no predefined splits
  dataset.num_test: 0.1              # Ratio of the test data if there are no predefined splits
  dataset.normalize_feats: False       # Whether to row-normalize node features
  dataset.normalize_adj: False        # Whether to symmetrically normalize adjacency matrix
  dataset.add_self_loops: False        # Whether to add self-loops to the adjacency matrix

  training.lr: 0.01                  # Learning rate for the optimizer
  training.weight_decay: 0.01      # Weight decay (L2 regularization coefficient)
  training.epochs: 20000              # Maximum number of training epochs
  training.patience: 500             # Early stopping patience (stop if no improvement after this many epochs)
  training.min_epochs: 100           # Minimum number of epochs to run before early stopping can kick in  
  training.seeds: [42, 123, 99, 18, 456, 10, 1, 44, 666, 11]  # List of random seeds for reproducibility across runs
  training.batch_size:               # Batch size (leave empty for full-batch GNN training)
  training.optimizer: adam           # Optimizer to use (e.g., 'adam', 'sgd')
  training.momentum: 0.999           # Momentum for the optimizer (if applicable)  
  training.scheduler_gamma: None     # Gamma for step scheduler, if used  
  training.scheduler:                # Learning rate scheduler (e.g., 'step', 'cosine', or leave empty for none)
  training.grad_clip: None            # Max norm for gradient clipping, or None for no gradient clipping
  training.margin: 2.0                # Margin for MarginLoss (if applicable)

  model.name: GAT                   # Model type (e.g., 'gcn', 'hgcn', 'gat')
  model.hidden_dim: 64               # Number of hidden units in each layer
  model.dropout: 0.0               # Dropout rate (0.0 means no dropout)
  model.manifold: Euclidean         # Type of manifold (e.g., 'PoincareBall', 'Lorentz', or None if Euclidean)
  model.c: None                     # Curvature constant for hyperbolic models
  model.bias: None                  # Whether to include bias terms in layers
  model.act: tanh                   # Activation function (e.g., 'relu', 'tanh')
  model.num_layers: 1               # Number of layers
  model.num_heads: 1                # Number of attention heads (only for GAT)
  model.concat: True                # Whether to concatenate multi-head results (only for GAT)