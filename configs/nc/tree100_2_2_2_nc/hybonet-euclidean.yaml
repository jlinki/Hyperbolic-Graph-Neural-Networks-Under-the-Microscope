project: Hyperbolic GNNs  # W&B project name

parameters:
  dataset.name: tree1111_g00_lp      # Name of the dataset (e.g., 'cora', 'citeseer', 'pubmed')
  dataset.task: nc                   # Task type: 'nc' for node classification, 'lp' for link prediction, etc.
  dataset.split: test_rest            # Split strategy (e.g., 'geom-gcn', 'random', 'fixed')
  dataset.num_val: 200              # Ratio of the validation data if there are no predefined splits
  dataset.normalize_adj: true       # Whether to row-normalize the adjacency matrix (true/false)
  dataset.normalize_feats: false    # Whether to row-normalize the node features (true/false)
  dataset.label: "branch"   # Type of labels to use (e.g., 'leaf_or_not', 'branch', etc.)

  training.lr: 0.005                 # Learning rate for the optimizer
  training.weight_decay: 0           # Weight decay (L2 regularization coefficient)
  training.epochs: 5000              # Maximum number of training epochs
  training.patience: 500             # Early stopping patience (stop if no improvement after this many epochs)
  training.min_epochs: 100           # Minimum number of epochs to run before early stopping can kick in
  training.seeds: [42, 123, 99, 18, 456, 10, 1, 44, 666, 11]  # List of random seeds for reproducibility across runs
  training.optimizer: adam          # Optimizer to use (e.g., 'adam', 'sgd')
  training.momentum: 0.999           # Momentum for the optimizer (if applicable)
  training.scheduler: StepLR         # Learning rate scheduler (e.g., 'step', 'cosine', or leave empty for none)
  training.scheduler_gamma: 0.5      # Gamma for step scheduler, if used
  training.lr_reduce_freq : None     # Frequency of learning rate reduction, if applicable
  training.grad_clip: 1.0            # Max norm for gradient clipping, or None for no gradient clipping

  model.name: HyboNet                   # Model type (e.g., 'gcn', 'hgcn', 'gat')
  model.hidden_dim: 128                 # Number of hidden units in each layer
  model.dropout: 0                      # Dropout rate (0.0 means no dropout)
  model.manifold: Euclidean             # Type of manifold (e.g., 'PoincareBall', 'Lorentz', or leave empty if Euclidean)
  model.c: 1.0                          # Curvature constant for hyperbolic models
  model.r: 2.                           # Radius for Fermi-Dirac decoder (used in link prediction)
  model.t: 1.                           # Temperature for Fermi-Dirac decoder (used in link prediction)
  model.pretrained_embeddings: null     # Path to pretrained node embeddings, if any
  model.pos_weight: false               # Use positive class weighting in loss (for class imbalance)
  model.num_layers: 6                   # Number of layers
  model.bias: true                      # Whether to include bias terms in layers
  model.act: leaky_relu                 # Activation function (e.g., 'relu', 'tanh')
  model.n_heads: 1                      # Number of attention heads (used for GAT-like models); must be a divisor dim
  model.use_att: 0                      # Whether to use attention mechanism
  model.double_precision: false         # Use float64 instead of float32 (for numerical stability)
  model.margin: false