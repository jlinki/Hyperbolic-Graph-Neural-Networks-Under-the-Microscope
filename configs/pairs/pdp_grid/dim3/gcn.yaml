project: Hyperbolic GNNs

parameters:
  dataset.name: pdp_grid             # Name of the dataset (e.g., 'cora', 'citeseer', 'pubmed')
  dataset.task: pairs                # Task type: 'nc' for node classification, 'lp' for link prediction, etc.
  dataset.split: geom-gcn            # Split strategy (e.g., 'geom-gcn', 'random', 'fixed')
  dataset.normalize_feats: False     # Whether to row-normalize node features
  dataset.normalize_adj: False       # Whether to row-normalize adjacency matrix

  training.lr: 0.01                  # Learning rate for the optimizer
  training.weight_decay: 0.0001      # Weight decay (L2 regularization coefficient)
  training.epochs: 5000              # Maximum number of training epochs
  training.patience: 500             # Early stopping patience (stop if no improvement after this many epochs)
  training.min_epochs: 100           # Minimum number of epochs to run before early stopping can kick in  
  training.seeds: [42, 123, 99, 18, 456, 10, 1, 44, 666, 11]  # List of random seeds for reproducibility across runs
  training.optimizer: adam           # Optimizer to use (e.g., 'adam', 'sgd')
  training.momentum: 0.999           # Momentum for the optimizer (if applicable)  
  training.scheduler_gamma: 0.5      # Gamma for step scheduler, if used 
  training.lr_reduce_freq: None      # Frequency of learning rate reduction, if applicable 
  training.scheduler: StepLR         # Learning rate scheduler (e.g., 'step', 'cosine', or leave empty for none)
  training.grad_clip: None           # Max norm for gradient clipping, or None for no gradient clipping


  model.name: GCN                   # Model type (e.g., 'gcn', 'hgcn', 'gat', 'gatv2')
  model.hidden_dim: 3               # Number of hidden units in each layer
  model.dropout: 0.0                # Dropout rate (0.0 means no dropout)
  model.manifold: Euclidean         # Type of manifold (e.g., 'PoincareBall', 'Lorentz', or None if Euclidean)
  model.c: 0.                       # Curvature constant for hyperbolic models
  model.r: None                     # Radius for Fermi-Dirac decoder (used in link prediction)
  model.t: None                     # Temperature for Fermi-Dirac decoder (used in link prediction)
  model.pretrained_embeddings: null # Path to pretrained node embeddings, if any
  model.pos_weight: false           # Use positive class weighting in loss (for class imbalance)
  model.n_heads: None               # Number of attention heads (used for GAT-like models); must be a divisor dim
  model.double_precision: false     # Use float64 instead of float32 (for numerical stability)
  model.bias: true                  # Whether to include bias terms in layers
  model.act: tanh                   # Activation function (e.g., 'relu', 'tanh')
  model.num_layers: 6               # Number of layers
  model.use_att: None               # Whether to use attention mechanism